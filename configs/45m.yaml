model:
  # d=512/22L/2.5 was ~70M; this is ~44M with an 8k vocab (see test_param_budget_45m)
  vocab_size: 8192
  d_model: 448
  n_layers: 20
  n_heads: 8
  n_kv: 4
  ffn_mult: 2.0
  rope_theta: 10000.0
  max_seq: 512
  retrieve_k: 5

loss:
  structure: 1.0
  keys: 1.5
  names: 2.0
  values: 4.0
  stop: 6.0

train:
  packed_len: 512
  global_tokens: 65536
  lr_muon: 0.02
  lr_adam: 3.0e-4
  wd: 0.01
  refuse_frac: 0.13
  epochs: 4

teachers:
  volume: deepseek/deepseek-v4-flash
  hard: google/gemini-3.7-flash:batch
  hard_frac: 0.2
  provider_sort: exacto

spend:
  openrouter_cap: 80
  runpod_cap: 80
