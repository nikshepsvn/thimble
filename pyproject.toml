[project]
name = "tiny-toolcall"
version = "0.1.0"
description = "A tool-calling layer: your schemas in, validated calls out, at 48M parameters"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "httpx>=0.27",
  "orjson>=3.10",
  "pyyaml>=6.0",
  "torch>=2.5",
]

[project.optional-dependencies]
hub = ["huggingface_hub>=0.26"]   # only needed to fetch the weights
dev = ["pytest>=8.0"]
train = []                        # torch is a core dep now; kept so [train] still resolves

[project.scripts]
ttc = "tiny_toolcall.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
