[project]
name = "tiny-toolcall"
version = "0.1.0"
description = "45M factorized on-device tool caller"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "httpx>=0.27",
  "orjson>=3.10",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
train = ["torch>=2.5"]
dev = ["pytest>=8.0"]

[project.scripts]
ttc = "tiny_toolcall.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
